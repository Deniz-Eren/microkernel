set timeout=0
set default=0
menuentry "Microkernel" {
    multiboot2 /boot/kernel.elf
    module2 /boot/boot.tar bootfs
    boot
}
menuentry "Microkernel (Interactive Shell)" {
    multiboot2 /boot/kernel.elf init=sh
    module2 /boot/boot.tar bootfs
    boot
}
