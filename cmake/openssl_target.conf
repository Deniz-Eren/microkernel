# need:: COMP_LIBC_0030 COMP_LIBC_0034

my %targets = (
    "microkernel-x86_64-base" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "clang",
        defines          => [
            "L_ENDIAN",
            "NO_SYS_PARAM_H",
            "h_errno=errno",
            "OPENSSL_NO_SECURE_MEMORY",
            "OPENSSL_NO_POSIX_IO_MMAP",
            "DEVRANDOM=\"\\\"/dev/urandom\\\"\"",
            "_GNU_SOURCE",
            "_DEFAULT_SOURCE",
        ],
        thread_scheme    => "pthreads",
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        ranlib           => "llvm-ranlib",
        ar               => "llvm-ar",
        sys_id           => "MICROKERNEL",
    },
    "microkernel-x86_64" => {
        inherit_from     => [ "microkernel-x86_64-base" ],
        cflags           => "-O2 -ffreestanding -nostdlib -nostdinc " .
                            "-fno-builtin -fno-stack-protector " .
                            "-fno-pic -fno-pie " .
                            "-fno-asynchronous-unwind-tables " .
                            "-target x86_64-unknown-none-elf " .
                            "-march=x86-64-v3 -mno-red-zone -std=gnu17 -w",
    },
    "microkernel-x86_64-pic" => {
        inherit_from     => [ "microkernel-x86_64-base" ],
        cflags           => "-O2 -ffreestanding -nostdlib -nostdinc " .
                            "-fno-builtin -fno-stack-protector " .
                            "-fPIC " .
                            "-fno-asynchronous-unwind-tables " .
                            "-target x86_64-unknown-none-elf " .
                            "-march=x86-64-v3 -mno-red-zone -std=gnu17 -w",
    },
);

