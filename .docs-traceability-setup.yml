# need:: ICD_DOCS_0001

project:
  name: "microkernel"
  repo_url: ""
  domains:
    - BOOT
    - MEM
    - PROC
    - IPC
    - SIG
    - LIBC
    - DOCS

id:
  style: number
  digits: 4

authoring:
  primary_markup: myst
  modal_verb: must

model:
  decision_types:
    - adr
    - bdr
    - wdr
  ver_method_tags:
    - unit
    - integration
    - network
    - analysis
  test_file_patterns:
    - "test_*"
    - "*_test.*"
    - "check_*"
  code_tag_exclude:
    # Legal attribution notice and agent runtime definitions/skills. They are
    # not Sphinx-Needs pages; the Sphinx build and the tag scan skip them.
    - THIRD-PARTY-NOTICES.md
    - agents
    - skills

build:
  cmake_mode: subdirectory
  python_manifest: requirements.txt
  docs_auto_install: false
  graphviz: auto

checks:
  file_headers: true
  prose_packing: true
